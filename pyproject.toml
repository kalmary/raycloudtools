[build-system]
requires = ["scikit-build-core>=0.11,<1"]
build-backend = "scikit_build_core.build"

[project]
name = "raycloud-tools"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[project.scripts]
rayextract = "raycloud_tools:main"

[dependency-groups]
basic = []
test = [
    { include-group = "basic" },
    "pytest>=9,<10",
]

[tool.uv]
default-groups = ["basic"]

[tool.scikit-build]
cmake.source-dir = "python"
wheel.packages = ["python/raycloud_tools"]
wheel.py-api = "py3"
install.components = ["python"]
build.targets = ["rayextract"]
build.tool-args = ["-j2"]
sdist.include = ["3rd-party/libnabo/**"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
